{% extends 'base.html' %}

{% block title %}Page Not Found - ApnaStay{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-coral" style="color: var(--primary-coral);">404</h1>
        <h2 class="fw-bold mb-3">Oops! We couldn't find that page.</h2>
        <p class="text-muted fs-5 mb-4 mx-auto" style="max-width: 500px;">
            The stay or page you're searching for might have been moved, deleted, or never existed in the first place.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'core:home' %}" class="btn btn-coral px-4">
                <i class="bi bi-house-door me-1"></i> Back to Homepage
            </a>
            <a href="{% url 'listings:list' %}" class="btn btn-outline-dark px-4">
                <i class="bi bi-search me-1"></i> Explore Stays
            </a>
        </div>
    </div>
</div>
{% endblock %}
